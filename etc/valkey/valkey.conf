# Container Valkey defaults (localhost only)
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised systemd
pidfile /run/valkey/valkey-server.pid
loglevel notice
logfile /var/log/valkey/valkey-server.log
dir /var/lib/valkey
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
maxmemory-policy allkeys-lru
